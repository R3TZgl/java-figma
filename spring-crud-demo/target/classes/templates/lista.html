<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Produtos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <h1 class="mb-4 text-center text-primary">📦 Lista de Produtos</h1>
    <div class="d-flex justify-content-between mb-3">
        <a href="/produtos/novo" class="btn btn-success">➕ Novo Produto</a>
    </div>

    <table class="table table-hover table-bordered bg-white shadow-sm">
        <thead class="table-primary">
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Categoria</th>
            <th>Preço (R$)</th>
            <th class="text-center">Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${produtos}">
            <td th:text="${p.id}"></td>
            <td th:text="${p.nome}"></td>
            <td th:text="${p.categoria}"></td>
            <td th:text="${p.preco}"></td>
            <td class="text-center">
                <a th:href="@{/produtos/visualizar/{id}(id=${p.id})}" class="btn btn-info btn-sm">👁 Ver</a>
                <a th:href="@{/produtos/editar/{id}(id=${p.id})}" class="btn btn-warning btn-sm">✏️ Editar</a>
                <a th:href="@{/produtos/deletar/{id}(id=${p.id})}" class="btn btn-danger btn-sm">🗑 Excluir</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
