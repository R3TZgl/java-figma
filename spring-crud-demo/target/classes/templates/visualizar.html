<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Visualizar Produto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h2 th:text="${produto.nome}">Produto</h2>
        </div>
        <div class="card-body">
            <p><strong>Categoria:</strong> <span th:text="${produto.categoria}"></span></p>
            <p><strong>Preço:</strong> R$ <span th:text="${produto.preco}"></span></p>
            <p><strong>Quantidade:</strong> <span th:text="${produto.quantidade}"></span></p>
            <p><strong>Descrição:</strong> <span th:text="${produto.descricao}"></span></p>
        </div>
        <div class="card-footer text-end">
            <a href="/produtos" class="btn btn-secondary">⬅ Voltar</a>
        </div>
    </div>
</div>
</body>
</html>
