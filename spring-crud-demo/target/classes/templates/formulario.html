<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Produto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <h1 class="text-center text-primary mb-4">📝 Cadastro de Produto</h1>

    <form th:action="@{/produtos}" th:object="${produto}" method="post" class="bg-white p-4 rounded shadow-sm">
        <input type="hidden" th:field="*{id}"/>

        <div class="mb-3">
            <label class="form-label">Nome</label>
            <input type="text" class="form-control" th:field="*{nome}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Categoria</label>
            <input type="text" class="form-control" th:field="*{categoria}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Preço</label>
            <input type="number" step="0.01" class="form-control" th:field="*{preco}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Quantidade</label>
            <input type="number" class="form-control" th:field="*{quantidade}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Descrição</label>
            <textarea class="form-control" rows="3" th:field="*{descricao}"></textarea>
        </div>

        <div class="d-flex justify-content-between">
            <a href="/produtos" class="btn btn-secondary">⬅ Voltar</a>
            <button type="submit" class="btn btn-primary">💾 Salvar</button>
        </div>
    </form>
</div>
</body>
</html>
